<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samkent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .dynamic-island {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 6px 14px;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.5s ease, opacity 0.4s ease, border-color 0.2s ease;
        }

        .dynamic-island.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .island-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888888;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            transition: color 0.2s ease;
        }

        .github-icon {
            width: 14px;
            height: 14px;
            fill: #888888;
            transition: fill 0.2s ease;
        }

        .dynamic-island:hover {
            border-color: #444444;
        }

        .dynamic-island:hover .island-link {
            color: #ffffff;
        }

        .dynamic-island:hover .github-icon {
            fill: #ffffff;
        }

        .content {
            max-width: 600px;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p {
            color: #888888;
            margin-bottom: 20px;
            font-size: 14px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="dynamicIsland" class="dynamic-island">
        <a href="https://github.com/thesamkent" class="island-link">
            <svg class="github-icon" viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>&larr; return to github.com/thesamkent</span>
        </a>
    </div>

    <div class="content">
        <h1>Samkent</h1>
        <p>
            Self-taught security researcher and developer.
        </p>
        <p>
            Building low-level software, cryptographic algorithms, 
            and memory architectures from first principles.
        </p>
        <p>
            <a href="https://github.com/thesamkent" target="_blank">github.com/thesamkent</a>
        </p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const isFromGithub = document.referrer.toLowerCase().includes('github.com') || 
                                 window.location.search.includes('ref=github') ||
                                 window.location.search.includes('from=github');
            
            if (isFromGithub) {
                const island = document.getElementById('dynamicIsland');
                setTimeout(() => {
                    island.classList.add('visible');
                }, 200);
            }
        });
    </script>
</body>
</html>
